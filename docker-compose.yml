services:
  # Frontend - React application served via Nginx
  client:
    container_name: web-server
    build: ./client
    ports:
      - "127.0.0.1:3100:80"
    networks:
      - frontend
      - backend
    depends_on:
      - db
      - server
    restart: always

  # Backend - ASP.NET Core 8 Web API
  server:
    container_name: rest-server
    build: ./server
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      - MongoDBSettings__ConnectionString=${MONGO_CONNECTION_STRING}
      - MongoDBSettings__DatabaseName=${MONGO_DATABASE_NAME}
      - Token__Key=${JWT_SECRET_KEY}
      - Token__Issuer=${JWT_ISSUER}
      - Token__Audience=${JWT_AUDIENCE}
      - DemoUser__Username=${DEMO_USERNAME}
      - DemoUser__Email=${DEMO_EMAIL}
      - DemoUser__Password=${DEMO_PASSWORD}
    networks:
      - backend
    depends_on:
      - db
    restart: always

  # Database - Official MongoDB image
  db:
    container_name: database-server
    image: mongo:latest
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      - backend
    volumes:
      - mongo_crypto_data:/data/db
    restart: always

networks:
  backend:
  frontend:

volumes:
  mongo_crypto_data: