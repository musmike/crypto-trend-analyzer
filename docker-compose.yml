version: '3.7'

services:
  client:
    container_name: web_server
    build: ./client
    ports:
      - "3100:80"
    networks:
      - frontend
      - backend
    depends_on:
     - db
     - server
    restart: always

  server:
    container_name: rest-server
    build: ./server
    ports:
      - "8089:8080"
    networks:
      - backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    restart: always

  db:
    container_name: database_server
    build: ./mongodb
    ports:
      - "27018:27017"
    networks:
      - backend
    volumes:
      - db_dumps:/data/db
      - ./mongodb/init:/mongodb/init
    command: ["bash", "/mongodb/init/init.sh"]
    restart: always

networks:
  backend:
  frontend:

volumes:
  db_dumps:
